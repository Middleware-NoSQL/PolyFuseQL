volumes:
  polyfuseql-postgres-data:
  polyfuseql-redis-data:
  polyfuseql-neo4j-data:
  polyfuseql-mongo-data:
  polyfuseql-cassandra-data:

networks:
  polyfuse-net:
    driver: bridge

services:
  # ────────────── TPC-H Data Generator (DBGEN) ────────────── #
  dbgen:
    build: ./docker/dbgen
    container_name: polyfuseql-tpch-dbgen
    volumes:
      - ./docker/tpch-data:/data
    entrypoint: /bin/sh
    command: >
      -c "rm -f /data/*.tbl && 
          tpchgen-cli --scale-factor $${SCALE_FACTOR:-10} --output-dir /data && 
          chown $${UID:-1000}:$${GID:-1000} /data/*"
    networks:
      - polyfuse-net

  # ────────────── PostgreSQL ────────────── #
  postgres:
    image: postgres:16-alpine
    container_name: polyfuseql-pg-tpch
    profiles: [ "postgres", "db" ]
    environment:
      POSTGRES_DB: tpch
      POSTGRES_USER: tpch
      POSTGRES_PASSWORD: tpch
    volumes:
      - polyfuseql-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
      - ./docker/tpch-data:/tpch-data:ro
      - ./tests/fixtures:/test-data:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tpch -d tpch && psql -U tpch -d tpch -c 'SELECT 1 FROM region LIMIT 1'" ]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      dbgen:
        condition: service_completed_successfully
    networks:
      - polyfuse-net

  # ────────────── Redis ────────────── #
  redis:
    image: redis/redis-stack:latest
    container_name: polyfuseql-redis-kv
    profiles: [ "redis", "db" ]
    command: [ "redis-stack-server", "--requirepass", "tpch", "--protected-mode", "no" ]
    volumes:
      - polyfuseql-redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "tpch", "ping" ]
      interval: 5s
      retries: 10
    networks:
      - polyfuse-net

  # ────────────── Neo4j ────────────── #
  neo4j:
    image: neo4j:5-community
    container_name: polyfuseql-neo4j-graph
    profiles: [ "neo4j", "db" ]
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_server_directories_import: "/var/lib/neo4j/import"
      
      # OPTIMIZATION: Fixed heap thrashing bounds & pagecache memory allocation
      NEO4J_server_memory_heap_initial__size: 4G
      NEO4J_server_memory_heap_max__size: 4G
      NEO4J_server_memory_pagecache_size: 2G
    volumes:
      - ./docker/tpch-data:/var/lib/neo4j/import/tpch-data:ro
      - ./tests/fixtures:/var/lib/neo4j/import/fixtures:ro
    ports:
      - "7687:7687"
      - "7474:7474"
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1" ]
      interval: 10s
      timeout: 15s
      retries: 20
    depends_on:
      dbgen:
        condition: service_completed_successfully
    networks:
      - polyfuse-net

  # ────────────── MongoDB ────────────── #
  mongodb:
    image: mongo:latest
    container_name: polyfuseql-mongodb
    profiles: [ "mongodb", "db" ]
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example
    volumes:
      - polyfuseql-mongo-data:/data/db
    healthcheck:
      test: "mongosh --port 27017 --username root --password example --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)'"
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - polyfuse-net

  # ────────────── Cassandra ────────────── #
  cassandra:
    image: cassandra:latest
    container_name: polyfuseql-cassandra
    profiles: [ "cassandra", "db", "cassandra-services" ]
    ports:
      - "9043:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=PolyFuseCluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=SimpleSnitch
      - CASSANDRA_AUTHENTICATOR=PasswordAuthenticator
      - CASSANDRA_AUTHORIZER=CassandraAuthorizer
      - CASSANDRA_USER=cassandra
      - CASSANDRA_PASSWORD=cassandra
      - MAX_HEAP_SIZE=1024M
      - HEAP_NEWSIZE=200M
    volumes:
      - polyfuseql-cassandra-data:/var/lib/cassandra
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: [ "CMD-SHELL", "cqlsh -u cassandra -p cassandra -e 'describe keyspaces'" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - polyfuse-net

  # ─────────── Translator Services ─────────── #
  mongo-translator-api:
    build:
      context: .
      dockerfile: docker/mongo-translator/Dockerfile
    container_name: polyfuseql-mongo-translator
    profiles: [ "mongo-translator", "api" ]
    ports:
      - "5101:5000"
    environment:
      - MONGO_URI=mongodb://root:example@mongodb:27017/
      - AUTH_DB_NAME=sql_middleware_auth
      - JWT_SECRET_KEY=dev-secret
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - polyfuse-net

  cassandra-translator-api:
    build:
      context: .
      dockerfile: docker/cassandra-translator/Dockerfile
    container_name: polyfuseql-cassandra-translator
    profiles: [ "cassandra-translator", "api","cassandra-services" ]
    ports:
      - "3101:3000"
    environment:
      - CASSANDRA_HOST=cassandra
      - CASSANDRA_PORT=9042
      - CASSANDRA_USER=cassandra
      - CASSANDRA_PASSWORD=cassandra
      - CASSANDRA_KEYSPACE=tpch
      - CASSANDRA_DATA_CENTER=datacenter1
      - JWT_SECRET=your-jwt-secret
      - PERMISSIONS_API_URL=http://cassandra-translator-api-permission_service:3002/api/admin
    depends_on:
      cassandra:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - polyfuse-net

  cassandra-translator-api-auth_service:
    build:
      context: .
      dockerfile: docker/cassandra-auth-service/Dockerfile
    container_name: polyfuseql-cassandra-translator-auth
    profiles: [ "cassandra-auth", "api", "cassandra-services" ]
    ports:
      - "3001:3001"
    environment:
      - CASSANDRA_HOST=cassandra
      - CASSANDRA_PORT=9042
      - CASSANDRA_USER=cassandra
      - CASSANDRA_PASSWORD=cassandra
      - CASSANDRA_KEYSPACE=auth
      - CASSANDRA_LOCAL_DATACENTER=datacenter1
      - JWT_SECRET=your-jwt-secret
      - JWT_EXPIRATION_TIME=3600
    depends_on:
      cassandra:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3001/api" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - polyfuse-net

  cassandra-translator-api-permission_service:
    build:
      context: .
      dockerfile: docker/cassandra-permission-service/Dockerfile
    container_name: polyfuseql-cassandra-translator-permission
    profiles: [ "cassandra-permission", "api", "cassandra-services" ]
    ports:
      - "3002:3002"
    environment:
      - CASSANDRA_HOST=cassandra
      - CASSANDRA_PORT=9042
      - CASSANDRA_USER=cassandra
      - CASSANDRA_PASSWORD=cassandra
      - CASSANDRA_KEYSPACE=auth
      - CASSANDRA_LOCAL_DATACENTER=datacenter1
      - JWT_SECRET=your-jwt-secret
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - polyfuse-net

  # ────────────── Main Application ────────────── #
  polyfuseql:
    container_name: polyfuseql-app
    build:
      context: .
      dockerfile: docker/polyfuseql/Dockerfile
    profiles: [ "app" ]
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - polyfuse-net

  # ────────────── Data Loaders ────────────── #
  postgres-loader:
    image: postgres:16-alpine
    container_name: polyfuseql-loader-postgres-client
    profiles: [ "loader", "postgres-loader" ]
    volumes:
      - ./scripts:/scripts:ro
      - ./docker/tpch-data:/data:ro
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: tpch
      POSTGRES_USER: tpch
      POSTGRES_PASSWORD: tpch
    command: [ "/bin/bash", "/scripts/load_postgres.sh" ]
    networks:
      - polyfuse-net

  neo4j-loader:
    image: neo4j:5-community
    container_name: polyfuseql-loader-neo4j-client
    profiles: [ "loader", "neo4j-loader" ]
    volumes:
      - ./scripts:/scripts:ro
      - ./docker/tpch-data:/data:ro
    environment:
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password
    entrypoint: /bin/sh
    command: >
      -c "sleep 10 && 
          cypher-shell -a neo4j://neo4j:7687 -u neo4j -p password -f /scripts/load_neo4j.cypher"
    networks:
      - polyfuse-net

  redis-loader:
    image: python:3.12-slim
    container_name: polyfuseql-loader-redis-client
    profiles: [ "loader", "redis-loader" ]
    volumes:
      - ./docker/tpch-data:/data:ro
      - ./scripts:/scripts:ro
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: tpch
    command: >
      sh -c "pip install redis && python /scripts/load_redis.py"
    networks:
      - polyfuse-net

  mongo-loader:
    image: python:3.12-slim
    container_name: polyfuseql-loader-mongo-client
    profiles: [ "loader", "mongo-loader" ]
    volumes:
      - ./docker/tpch-data:/data:ro
      - ./scripts:/scripts:ro
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    command: >
      sh -c "pip install pymongo && python /scripts/load_mongo.py"
    networks:
      - polyfuse-net

  cassandra-loader:
    image: python:3.12-slim
    container_name: polyfuseql-loader-cassandra-client
    profiles: [ "loader", "cassandra-loader" ]
    volumes:
      - ./docker/tpch-data:/data:ro
      - ./scripts:/scripts:ro
    environment:
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: 9042
      CASSANDRA_USER: cassandra
      CASSANDRA_PASSWORD: cassandra
      CASSANDRA_KEYSPACE: tpch
    command: >
      sh -c "pip install cassandra-driver && python /scripts/load_cassandra.py"
    networks:
      - polyfuse-net

