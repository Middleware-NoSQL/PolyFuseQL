volumes:
  polyfuseql-postgres-data:
  polyfuseql-redis-data:
  polyfuseql-neo4j-data:
  polyfuseql-mongo-data:
  polyfuseql-cassandra-data:

networks:
  polyfuse-net:
    driver: bridge

services:
  # ────────────── TPC-H Data Generator (DBGEN) ────────────── #
  dbgen:
    build: ./docker/dbgen
    container_name: polyfuseql_tpch_dbgen
    volumes:
      - ./docker/tpch-data:/data
    entrypoint: /bin/sh
    # Updated command to use the Python CLI tool 'tpchgen'
    # Arguments (--scale, --output) are compatible with the Rust version
    command: >
      -c "tpchgen-cli --scale-factor 0.01 --output-dir /data && 
          chown ${UID:-1000}:${GID:-1000} /data/*"
    networks:
      - polyfuse-net


  # ────────────── PostgreSQL ────────────── #
  postgres:
    image: postgres:16-alpine
    container_name: polyfuseql_pg_tpch
    profiles: [ "postgres", "db" ]
    environment:
      POSTGRES_DB: tpch
      POSTGRES_USER: tpch
      POSTGRES_PASSWORD: tpch
    volumes:
      - polyfuseql-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
      - ./docker/tpch-data:/tpch-data:ro
      - ./tests/fixtures:/test-data:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tpch -d tpch && psql -U tpch -d tpch -c 'SELECT 1 FROM region LIMIT 1'" ]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      dbgen:
        condition: service_completed_successfully
    networks:
      - polyfuse-net

  # ────────────── Redis ────────────── #
  redis:
    image: redis/redis-stack:latest
    container_name: polyfuseql_redis_kv
    profiles: [ "redis", "db" ]
    command: [ "redis-stack-server", "--requirepass", "tpch", "--protected-mode", "no" ]
    volumes:
      - polyfuseql-redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "tpch", "ping" ]
      interval: 5s
      retries: 10
    networks:
      - polyfuse-net

  # ────────────── Neo4j ────────────── #
  neo4j:
    image: neo4j:5-community
    container_name: polyfuseql_neo4j_graph
    profiles: [ "neo4j", "db" ]
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_server_directories_import: "/var/lib/neo4j/import"
    volumes:
      - ./docker/tpch-data:/var/lib/neo4j/import/tpch-data:ro
      - ./tests/fixtures:/var/lib/neo4j/import/fixtures:ro
    ports:
      - "7687:7687"
      - "7474:7474"
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1" ]
      interval: 10s
      timeout: 15s
      retries: 20
    depends_on:
      dbgen:
        condition: service_completed_successfully
    networks:
      - polyfuse-net

  # ────────────── MongoDB ────────────── #
  mongodb:
    image: mongo:latest
    container_name: polyfuseql_mongodb
    profiles: [ "mongodb", "db" ]
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example
    volumes:
      - polyfuseql-mongo-data:/data/db
    healthcheck:
      test: "mongosh --port 27017 --username root --password example --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)'"
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - polyfuse-net

  # ────────────── Cassandra ────────────── #
  cassandra:
    image: cassandra:latest
    container_name: polyfuseql_cassandra
    profiles: [ "cassandra", "db", "cassandra-services" ]
    ports:
      - "9043:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=PolyFuseCluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=SimpleSnitch
      - CASSANDRA_AUTHENTICATOR=PasswordAuthenticator
      - CASSANDRA_AUTHORIZER=CassandraAuthorizer
      - CASSANDRA_USER=cassandra
      - CASSANDRA_PASSWORD=cassandra
      - MAX_HEAP_SIZE=1024M
      - HEAP_NEWSIZE=200M
    volumes:
      - polyfuseql-cassandra-data:/var/lib/cassandra
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: [ "CMD-SHELL", "cqlsh -u cassandra -p cassandra -e 'describe keyspaces'" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - polyfuse-net

  # ─────────── Translator Services ─────────── #
  mongo-translator-api:
    build:
      context: .
      dockerfile: docker/mongo-translator/Dockerfile
    container_name: polyfuseql_mongo_translator
    profiles: [ "mongo-translator", "api" ]
    ports:
      - "5101:5000"
    environment:
      - MONGO_URI=mongodb://root:example@mongodb:27017/
      - AUTH_DB_NAME=sql_middleware_auth
      - JWT_SECRET_KEY=dev-secret
    #depends_on:
    #  mongodb:
    #    condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - polyfuse-net

  cassandra-translator-api:
    build:
      context: . # The context is the root of your project
      dockerfile: docker/cassandra-translator/Dockerfile # Path to the new Dockerfile
    container_name: polyfuseql_cassandra_translator
    profiles: [ "cassandra-translator", "api","cassandra-services" ]
    ports:
      - "3101:3000"
    environment:
      - CASSANDRA_HOST=cassandra
      - CASSANDRA_PORT=9042
      - CASSANDRA_USER=cassandra
      - CASSANDRA_PASSWORD=cassandra
      - CASSANDRA_KEYSPACE=mykeyspace
      - CASSANDRA_DATA_CENTER=datacenter1
      - JWT_SECRET=your-jwt-secret
      - PERMISSIONS_API_URL=http://cassandra-translator-api-permission_service:3002/api/admin
    depends_on:
      cassandra:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - polyfuse-net

  # ------------------ Authentication Service ------------------
  cassandra-translator-api-auth_service:
    build:
      context: .
      dockerfile: docker/cassandra-auth-service/Dockerfile
    container_name: polyfuseql_cassandra_translator_auth
    profiles: [ "cassandra-auth", "api", "cassandra-services" ]
    ports:
      - "3001:3001"
    environment:
      # These variables are based on the auth-service code structure
      - CASSANDRA_HOST=cassandra
      - CASSANDRA_PORT=9042
      - CASSANDRA_USER=cassandra
      - CASSANDRA_PASSWORD=cassandra
      - CASSANDRA_KEYSPACE=auth
      - CASSANDRA_LOCAL_DATACENTER=datacenter1
      - JWT_SECRET=your-jwt-secret # Add a secret for JWT
      - JWT_EXPIRATION_TIME=3600
    depends_on:
      cassandra:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3001/api" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - polyfuse-net
  cassandra-translator-api-permission_service:
    build:
      context: .
      dockerfile: docker/cassandra-permission-service/Dockerfile
    container_name: polyfuseql_cassandra_translator_permission
    profiles: [ "cassandra-permission", "api", "cassandra-services" ]
    ports:
      - "3002:3002"
    environment:
      - CASSANDRA_HOST=cassandra
      - CASSANDRA_PORT=9042
      - CASSANDRA_USER=cassandra
      - CASSANDRA_PASSWORD=cassandra
      - CASSANDRA_KEYSPACE=auth # It uses the same keyspace as the auth service.
      - CASSANDRA_LOCAL_DATACENTER=datacenter1
      - JWT_SECRET=your-jwt-secret
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - polyfuse-net
  polyfuseql:
    container_name: polyfuseql_app
    build:
      context: .
      dockerfile: docker/polyfuseql/Dockerfile
    profiles: [ "app" ]
    ports:
      - "8000:8000"
    # Load environment variables from .env
    env_file:
      - .env
    # Allow communication with the local host machine if necessary
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Wait for databases to be healthy before starting
    networks:
      - polyfuse-net
  postgres-loader:
    # Use standard Postgres image just to get the 'psql' client tool
    image: postgres:16-alpine
    container_name: polyfuseql_loader_postgres_client
    profiles: [ "loader", "postgres-loader" ]
    volumes:
      - ./scripts:/scripts:ro
      - ./docker/tpch-data:/data:ro
    environment:
      POSTGRES_HOST: postgres # Connects to the 'postgres' service defined above
      POSTGRES_DB: tpch
      POSTGRES_USER: tpch
      POSTGRES_PASSWORD: tpch
    command: [ "/bin/bash", "/scripts/load_postgres.sh" ]
    #depends_on:
    #  postgres:
    #    condition: service_healthy
    networks:
      - polyfuse-net

  neo4j-loader:
    # Use Neo4j image just to get 'cypher-shell' client tool
    image: neo4j:5-community
    container_name: polyfuseql_loader_neo4j_client
    profiles: [ "loader", "neo4j-loader" ]
    volumes:
      - ./scripts:/scripts:ro
      - ./docker/tpch-data:/data:ro
    environment:
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password
    entrypoint: /bin/sh
    # Connects to 'neo4j' service defined above
    command: >
      -c "sleep 10 && 
          cypher-shell -a neo4j://neo4j:7687 -u neo4j -p password -f /scripts/load_neo4j.cypher"
#    depends_on:
#      neo4j:
#        condition: service_healthy
    networks:
      - polyfuse-net

  redis-loader:
    # Lightweight python image to run the load script
    image: python:3.12-slim
    container_name: polyfuseql_loader_redis_client
    profiles: [ "loader", "redis-loader" ]
    volumes:
      - ./docker/tpch-data:/data:ro
      - ./scripts:/scripts:ro
    environment:
      REDIS_HOST: redis # Connects to the 'redis' service defined above
      REDIS_PORT: 6379
      REDIS_PASSWORD: tpch
    # Install redis lib on the fly and run script
    command: >
      sh -c "pip install redis && python /scripts/load_redis.py"
#    depends_on:
#      redis:
#        condition: service_healthy
    networks:
      - polyfuse-net
  mongo-loader:
    image: python:3.12-slim
    container_name: polyfuseql_loader_mongo_client
    profiles: [ "loader", "mongo-loader" ]
    volumes:
      - ./docker/tpch-data:/data:ro
      - ./scripts:/scripts:ro
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    # Install pymongo on the fly and run script
    command: >
      sh -c "pip install pymongo && python /scripts/load_mongo.py"
#    depends_on:
#      mongodb:
#        condition: service_healthy
    networks:
      - polyfuse-net

  cassandra-loader:
    image: python:3.12-slim
    container_name: polyfuseql_loader_cassandra_client
    profiles: [ "loader", "cassandra-loader" ]
    volumes:
      - ./docker/tpch-data:/data:ro
      - ./scripts:/scripts:ro
    environment:
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: 9042
      CASSANDRA_USER: cassandra
      CASSANDRA_PASSWORD: cassandra
      CASSANDRA_KEYSPACE: tpch
    # Install cassandra-driver on the fly and run script
    command: >
      sh -c "pip install cassandra-driver && python /scripts/load_cassandra.py"
#    depends_on:
#      cassandra:
#        condition: service_healthy
    networks:
      - polyfuse-net