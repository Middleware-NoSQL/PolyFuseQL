# docker-compose.yml – TPC-H Benchmark Stack (Production Version)
# This version integrates all corrections for data generation and database services.

volumes:
  postgres-data:
  redis-data:
  neo4j-data:

services:
  # ────────────── TPC-H Data Generator (DBGEN) ────────────── #
  dbgen:
    build: ./docker/dbgen
    container_name: tpch_dbgen
    # This service runs as root to create files, then changes ownership.
    volumes:
      - ./docker/tpch-data:/data
    entrypoint: /bin/sh
    command: -c "cp /usr/local/bin/dists.dss /data && cd /data && /usr/local/bin/dbgen -s 1 -f -v && chown ${UID:-1000}:${GID:-1000} ./*"

  # ────────────── PostgreSQL ────────────── #
  postgres:
    image: postgres:16-alpine
    container_name: pg_tpch
    environment:
      POSTGRES_DB: tpch
      POSTGRES_USER: tpch
      POSTGRES_PASSWORD: tpch
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
      - ./docker/tpch-data:/tpch-data:ro
      - ./tests/fixtures:/test-data:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tpch -d tpch && psql -U tpch -d tpch -c 'SELECT 1 FROM region LIMIT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      dbgen:
        condition: service_completed_successfully

  # ────────────── Redis ────────────── #
  redis:
    image: redis/redis-stack:latest
    container_name: redis_kv
    command:
      - redis-stack-server
      - --requirepass
      - tpch
      - --protected-mode
      - "no"
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "tpch", "ping"]
      interval: 5s
      retries: 10

  # ────────────── Neo4j ────────────── #
  neo4j:
    image: neo4j:5-community
    container_name: neo4j_graph_test
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_server_directories_import: "/var/lib/neo4j/import"

      # --- MEMORY CONFIGURATION FIX ---
      # Corrected environment variable names based on official Neo4j 5.x documentation.
      # Note the double underscores for settings that contain an underscore, e.g., initial_size -> initial__size.
      NEO4J_server_memory_heap_initial__size: 6G
      NEO4J_server_memory_heap_max__size: 6G
      NEO4J_dbms_memory_transaction_total_max: 7G

    volumes:
      - ./docker/tpch-data:/var/lib/neo4j/import/tpch-data:ro
      - ./tests/fixtures:/var/lib/neo4j/import/fixtures:ro
    ports:
      - "7687:7687"
      - "7474:7474"
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1" ]
      interval: 10s
      timeout: 15s
      retries: 20
    depends_on:
      dbgen:
        condition: service_completed_successfully
