# docker-compose.yml – TPC-H Benchmark Stack

volumes:
  postgres-data:
  redis-data:
  neo4j-data:
  tpch-data: # Shared volume for TPC-H data generated by dbgen

services:
  # ────────────── TPC-H Data Generator (DBGEN) ────────────── #
  dbgen:
    build: ./docker/dbgen
    container_name: tpch_dbgen
    volumes:
      - tpch-data:/data
    # This command generates data for Scale Factor 1 (approx 1GB)
    # It will only run once. To regenerate, you must remove the volume.
    command: dbgen -s 1 -f -v && mv *.tbl /data

  # ────────────── PostgreSQL ────────────── #
  postgres:
    image: postgres:16-alpine
    container_name: pg_tpch
    environment:
      POSTGRES_DB: tpch
      POSTGRES_USER: tpch
      POSTGRES_PASSWORD: tpch
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # This mounts the schema script and a loading script (for the next user story)
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
      # Mount the generated data for bulk loading
      - tpch-data:/tpch-data:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tpch"]
      interval: 5s
      retries: 10
    depends_on:
      - dbgen

  # ────────────── Redis ────────────── #
  redis:
    image: redis/redis-stack:latest
    container_name: redis_kv
    command:
      - redis-stack-server
      - --requirepass
      - tpch
      - --protected-mode
      - "no"
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "tpch", "ping"]
      interval: 5s
      retries: 10

  # ────────────── Neo4j ────────────── #
  neo4j:
    image: neo4j:5-community
    container_name: neo4j_graph
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4JLABS_PLUGINS: '["apoc"]'
      # Allow importing from the mounted volume
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_directories_import: "/tpch-data"
    volumes:
      - neo4j-data:/data
      # Mount the initialization scripts
      - ./docker/neo4j/init:/var/lib/neo4j/init
      # Mount the generated data for bulk loading
      - tpch-data:/tpch-data:ro
    ports:
      - "7687:7687"
      - "7474:7474"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 10s
      retries: 15
    depends_on:
      - dbgen
